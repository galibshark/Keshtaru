<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>চেকআউট - Keshtaru</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="navbar-placeholder"></div>



    <!-- ==========================================
         মূল চেকআউট সেকশন শুরু
    =========================================== -->
    <div class="container py-5">
        <div class="row">

            <!-- 
                বাম দিকের কলাম (কাস্টমারের তথ্য নেওয়ার ফর্ম) 
            -->
            <div class="col-md-7 mb-4">
                <h3 class="fw-bold mb-4 border-bottom pb-2">ডেলিভারি তথ্য (Billing Details)</h3>

                <form id="checkout-form">

                    <!-- নাম ইনপুট -->
                    <div class="mb-3">
                        <label class="form-label">আপনার নাম *</label>
                        <input type="text" id="c-name" class="form-control form-control-lg"
                            placeholder="যেমন: Galib Rahman" required>
                    </div>


                    <!-- ফোন নম্বর ইনপুট (১১ ডিজিট ভ্যালিডেশন হবে) -->
                    <div class="mb-3">
                        <label class="form-label">ফোন নম্বর *</label>
                        <input type="number" id="c-phone" class="form-control form-control-lg" placeholder="01XXXXXXXXX"
                            required>
                        <div id="phone-error" class="error-msg">অবশ্যই ১১ ডিজিটের সঠিক মোবাইল নম্বর দিতে হবে!</div>
                    </div>


                    <!-- ইমেইল ইনপুট (@ ভ্যালিডেশন হবে) -->
                    <div class="mb-3">
                        <label class="form-label">ইমেইল অ্যাড্রেস *</label>
                        <input type="email" id="c-email" class="form-control form-control-lg"
                            placeholder="example@email.com" required>
                        <div id="email-error" class="error-msg">সঠিক ইমেইল অ্যাড্রেস দিন (যাতে @ এবং . থাকে)!</div>
                    </div>


                   
                    <!-- ডেলিভারি লোকেশন বক্স শুরু -->
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-4 text-success"><i class="bi bi-geo-alt-fill"></i> ডেলিভারি লোকেশন *</h5>
                            
                            <!-- লাইভ লোকেশন ডিসক্লেইমার ও বাটন -->
                            <div class="location-btn-box mb-4 mt-2">
                                <p class="text-secondary mb-3 text-center fw-medium" style="font-size: 0.9rem;">
                                    <i class="bi bi-info-circle-fill text-primary"></i> এক ক্লিকেই অটোমেটিক আপনার সঠিক ঠিকানা সেট করতে নিচের বাটনে ক্লিক করুন:
                                </p>
                                
                                <!-- বাটনটা এখন w-75 (৭৫% চওড়া) এবং mx-auto দিয়ে মাঝখানে রাখা হয়েছে -->
                                <button type="button" class="btn btn-primary w-75 mx-auto fw-bold fs-5 py-3 shadow-sm d-flex justify-content-center align-items-center gap-2 rounded-3" id="live-location-btn" style="transition: all 0.3s ease; background-color: #0d6efd; border: none;">
                                    <i class="bi bi-geo-alt-fill fs-4 text-white"></i> 
                                    <span>Live Location</span>
                                </button>
                            </div>

                            <!-- ডিভিশন, ডিস্ট্রিক্ট, উপজেলা ড্রপডাউন -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">বিভাগ (Division) *</label>
                                    <select class="form-select border-success" id="division-select" required>
                                        <option value="" selected disabled>বিভাগ নির্বাচন করুন</option>
                                        <!-- জাভাস্ক্রিপ্ট দিয়ে এখানে অপশন আসবে -->
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">জেলা (District) *</label>
                                    <select class="form-select" id="district-select" disabled required>
                                        <option value="" selected disabled>আগে বিভাগ নির্বাচন করুন</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">উপজেলা/থানা (Upazila) *</label>
                                    <select class="form-select" id="upazila-select" disabled required>
                                        <option value="" selected disabled>আগে জেলা নির্বাচন করুন</option>
                                    </select>
                                </div>
                            </div>

                            <!-- বিস্তারিত ঠিকানা -->
                            <div class="mb-3 mt-4">
                                <label class="form-label fw-bold">বিস্তারিত ঠিকানা *</label>
                                <textarea class="form-control" id="detailed-address" rows="3" placeholder="বাসা/রোড নম্বর, বিল্ডিংয়ের নাম বা ল্যান্ডমার্ক লিখুন..." required></textarea>
                            </div>
                        </div>
                    </div>
                    <!-- ডেলিভারি লোকেশন বক্স শেষ -->
                </form>
            </div>



            
            
            
            
            

                
            
            
            
                <!--ডান দিকের কলাম (অর্ডার সামারি বা হিসাব-নিকাশ) -->
               
                <div class="col-md-5">
                   <div class="checkout-box shadow-sm">
                   <h4 class="fw-bold mb-4 border-bottom pb-2">অর্ডার সামারি</h4>
                    <!-- কার্টের প্রোডাক্টগুলোর ছোট ছবির বক্স -->
                    <div id="checkout-img-container" class="d-flex gap-2 mb-3 overflow-auto pb-2">
                        <!-- জাভাস্ক্রিপ্ট এখানে অটোমেটিক ছবিগুলো বসাবে -->
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span id="summary-name" class="fw-bold text-muted">প্রোডাক্ট লোড হচ্ছে...</span>
                        <span id="summary-qty" class="fw-bold">x 0</span>
                    </div>

                    <div class="d-flex justify-content-between mb-3 border-bottom pb-3">
                        <span>মূল্য:</span>
                        <span id="summary-price" class="fw-bold text-success">৳ ০</span>
                    </div>

                    <div class="d-flex justify-content-between mb-4 fs-5 fw-bold">
                        <span>সর্বমোট (Total):</span>
                        <span id="total-price" class="text-danger">৳ ০</span>
                    </div>

                    <!-- [Place Order] বাটন -->
                    <button type="button" id="place-order-btn" class="btn btn-success btn-lg w-100 fw-bold shadow">
                        [Place Order] - অর্ডার সম্পন্ন করুন
                    </button>
                </div>
            </div>

        </div>
    </div>



    <!-- ==========================================
         জাভাস্ক্রিপ্ট (লজিক, ভ্যালিডেশন ও ডেটাবেস)
    =========================================== -->
    <script type="module">

       
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db } from './firebase-config.js';
        
       

        // =========================================================
        // ১. লগইন চেক এবং ফর্মে ডেটা অটো-ফিল করা (একদম বাইরে থাকবে)
        // =========================================================
        let currentUserEmail = "";
        onAuthStateChanged(auth, (user) => {
            const profileBtn = document.getElementById('profile-btn');
            if (user) {
                currentUserEmail = user.email;
                
                // ফর্মে অটো-ফিল করা
                document.getElementById('c-email').value = user.email;
                document.getElementById('c-name').value = user.displayName || "";

                if (profileBtn) {
                    profileBtn.classList.add('text-success', 'fw-bold');
                    profileBtn.href = "dashboard.html";
                }
            } else {
                alert("চেকআউট করতে হলে লগইন করা বাধ্যতামূলক!");
                window.location.href = "index.html"; // লগইন না থাকলে বের করে দেবে
            }
        });

        
        

        
        
        
        // =========================================================
        // ৩. ডাইরেক্ট অর্ডার (URL) বা কার্ট (Local Storage) থেকে ডেটা নেওয়া
        // =========================================================
        const urlParams = new URLSearchParams(window.location.search);
        const urlProductId = urlParams.get('id');
        const urlQty = parseInt(urlParams.get('qty')) || 1;

        let shoppingCart = [];

        // প্রাইস থেকে বাংলা লেখা ও ৳ চিহ্ন সরিয়ে শুধু আসল সংখ্যা বের করার ফাংশন
        function getNumericPrice(priceStr) {
            if (typeof priceStr === 'number') return priceStr;
            let engStr = priceStr.replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
            return parseInt(engStr.replace(/\D/g, '')) || 0;
        }

        // লজিক: যদি ডাইরেক্ট 'Order Now' থেকে আসে (লিংকে ID থাকে)
        if (urlProductId && window.productsDB[urlProductId]) {
            let p = window.productsDB[urlProductId];
            shoppingCart = [{
                id: urlProductId,
                name: p.name,
                price: getNumericPrice(p.price), // এই ফাংশনটি এখন আসল সংখ্যা বের করে নেবে!
                image: p.image,
                qty: urlQty
            }];
        } else {
            // আর যদি কার্ট থেকে আসে (লিংকে ID না থাকে)
            shoppingCart = JSON.parse(localStorage.getItem('keshtaru_cart')) || [];
        }

        

        // যদি দুটোই ফাঁকা থাকে, তবেই বের করে দেবে
        if (shoppingCart.length === 0) {
            alert("আপনার কার্টে কোনো প্রোডাক্ট নেই!");
            window.location.href = "index.html";
        }

        let totalOrderPrice = 0;
        let productNamesArray = [];
        const imgContainer = document.getElementById('checkout-img-container');
        imgContainer.innerHTML = ''; // আগের ফাঁকা ছবি ক্লিয়ার করা

        function convertToBanglaNumber(num) {
            return num.toString().replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
        }

        shoppingCart.forEach(item => {
            let itemTotal = item.price * item.qty;
            totalOrderPrice += itemTotal;
            
            productNamesArray.push(`${item.name} (Qty: ${item.qty})`);

            let imgHTML = `<img src="${item.image}" alt="${item.name}" class="shadow-sm border flex-shrink-0" style="width: 70px; height: 70px; object-fit: cover; border-radius: 8px;">`;
            imgContainer.innerHTML += imgHTML;
        });

        document.getElementById('summary-name').innerHTML = productNamesArray.join('<br><span class="text-muted" style="font-size: 0.85rem;">+</span><br>');
        
        let totalItems = shoppingCart.reduce((sum, item) => sum + item.qty, 0);
        document.getElementById('summary-qty').textContent = `মোট: ${convertToBanglaNumber(totalItems)} টি`;
        
        const banglaTotal = convertToBanglaNumber(totalOrderPrice);
        document.getElementById('summary-price').textContent = `৳ ${banglaTotal}`;
        document.getElementById('total-price').textContent = `৳ ${banglaTotal}`;




        

        // =========================================================
        // ৫. অর্ডার প্লেস করা (Firestore + Google Sheet)
        // =========================================================
        document.getElementById('place-order-btn').addEventListener('click', async function () {

            let name = document.getElementById('c-name').value.trim();
            let phone = document.getElementById('c-phone').value.trim();
            let email = document.getElementById('c-email').value.trim();
            let address = document.getElementById('c-address').value.trim();
            let mapLink = document.getElementById('c-map-link').value;

            document.getElementById('phone-error').style.display = "none";
            document.getElementById('email-error').style.display = "none";

            let isValid = true;

            if (phone.length !== 11 || !phone.startsWith("01")) {
                document.getElementById('phone-error').style.display = "block"; isValid = false;
            }
            if (!email.includes("@") || !email.includes(".")) {
                document.getElementById('email-error').style.display = "block"; isValid = false;
            }
            if (name === "" || address === "") {
                alert("দয়া করে নাম এবং বিস্তারিত ঠিকানা পূরণ করুন!"); isValid = false;
            }

            if (isValid) {
                let orderBtn = document.getElementById('place-order-btn');
                orderBtn.innerHTML = "অর্ডার সাবমিট হচ্ছে... ⏳";
                orderBtn.disabled = true;

                
                try {
                    const finalEmail = currentUserEmail ? currentUserEmail : email;

                    // ফায়ারবেসে পাঠানো
                    await addDoc(collection(db, "orders"), {
                        customerName: name,
                        customerPhone: phone,
                        userEmail: finalEmail,
                        address: address,
                        productName: productNamesArray.join(', '), // সব প্রোডাক্টের নাম একসাথে যাবে
                        qty: totalItems, // মোট আইটেম সংখ্যা
                        totalPrice: totalOrderPrice,
                        status: "Pending",
                        orderDate: new Date().toLocaleString('en-US', { timeZone: 'Asia/Dhaka' }),
                        timestamp: serverTimestamp()
                    });

                    // গুগল শিটে পাঠানো
                    let orderData = {
                        name: name, phone: phone, email: email, address: address,
                        mapLink: mapLink, 
                        productName: productNamesArray.join(', '),
                        productUrl: "Cart Order", 
                        qty: totalItems, totalPrice: totalOrderPrice
                    };

                    const scriptURL = 'https://script.google.com/macros/s/AKfycbwQKtWN59oVGvANiWCi3ExAGYUfU83aRxsRXh5wlBC6IlJ5jNWhXiNWuoQwmM3LNblkcA/exec';
                    await fetch(scriptURL, {
                        method: 'POST', body: JSON.stringify(orderData),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });

                    alert("ধন্যবাদ! আপনার অর্ডারটি সফলভাবে সম্পন্ন হয়েছে।");
                    localStorage.removeItem('keshtaru_cart');
                    window.location.href = "dashboard.html";

                } catch (error) {
                    alert("দুঃখিত, সার্ভারে সমস্যা হচ্ছে। দয়া করে আবার চেষ্টা করুন।");
                    orderBtn.innerHTML = "[Place Order] - অর্ডার সম্পন্ন করুন";
                    orderBtn.disabled = false;
                }
            }
        });
    </script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        
        // ==========================================
        // ১. ড্রপডাউন (Division > District > Upazila) ম্যাজিক
        // ==========================================
        const divisionSelect = document.getElementById('division-select');
        const districtSelect = document.getElementById('district-select');
        const upazilaSelect = document.getElementById('upazila-select');

        // পেজ লোড হলেই bdLocations ডাটাবেস থেকে সব বিভাগের নাম বসিয়ে দেওয়া
        for (let division in bdLocations) {
            divisionSelect.innerHTML += `<option value="${division}">${division}</option>`;
        }

        // কাস্টমার যখন 'বিভাগ' সিলেক্ট করবে
        divisionSelect.addEventListener('change', function() {
            const selectedDiv = this.value;
            
            // জেলা ড্রপডাউন আনলক করে ফাঁকা করা
            districtSelect.disabled = false;
            districtSelect.innerHTML = `<option value="" selected disabled>জেলা নির্বাচন করুন</option>`;
            
            // উপজেলা ড্রপডাউন লক ও ফাঁকা করা
            upazilaSelect.disabled = true;
            upazilaSelect.innerHTML = `<option value="" selected disabled>আগে জেলা নির্বাচন করুন</option>`;

            // নির্বাচিত বিভাগের জেলার নামগুলো বসানো
            for (let district in bdLocations[selectedDiv]) {
                districtSelect.innerHTML += `<option value="${district}">${district}</option>`;
            }

            // *** ডেলিভারি চার্জের লজিক (Inside/Outside Dhaka) ***
            if (selectedDiv === "Dhaka (ঢাকা)") {
                console.log("ইনসাইড ঢাকা: ডেলিভারি চার্জ ৬০ টাকা");
                // (পরে আমরা এখানে কার্টের সাথে টাকা যোগ করার কোড বসাবো)
            } else {
                console.log("আউটসাইড ঢাকা: ডেলিভারি চার্জ ১২০ টাকা");
            }
        });

        // কাস্টমার যখন 'জেলা' সিলেক্ট করবে
        districtSelect.addEventListener('change', function() {
            const selectedDiv = divisionSelect.value;
            const selectedDist = this.value;

            // উপজেলা ড্রপডাউন আনলক করে ফাঁকা করা
            upazilaSelect.disabled = false;
            upazilaSelect.innerHTML = `<option value="" selected disabled>উপজেলা/থানা নির্বাচন করুন</option>`;

            // নির্বাচিত জেলার উপজেলাগুলো বসানো
            const upazilas = bdLocations[selectedDiv][selectedDist];
            upazilas.forEach(function(upazila) {
                upazilaSelect.innerHTML += `<option value="${upazila}">${upazila}</option>`;
            });
        });


        // ==========================================
        // ২. লাইভ লোকেশন (Live Location) বাটনের ম্যাজিক
        // ==========================================
        const liveBtn = document.getElementById('live-location-btn');
        const addressBox = document.getElementById('detailed-address');

        liveBtn.addEventListener('click', function() {
            // খোঁজা শুরু হলে বাটনের চেহারা বদলাবে
            liveBtn.innerHTML = `<i class="bi bi-hourglass-split fs-4 text-white"></i> <span>লোকেশন খোঁজা হচ্ছে... ⏳</span>`;
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        // সফলভাবে লোকেশন পেলে
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        // ম্যাপের ফ্রি API দিয়ে অক্ষাংশ/দ্রাঘিমাংশ থেকে আসল ঠিকানা বের করা
                        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
                            .then(response => response.json())
                            .then(data => {
                                addressBox.value = data.display_name; // বক্সের ভেতর আসল ঠিকানা বসিয়ে দেওয়া
                                
                                // বাটন সবুজ করে সাকসেস মেসেজ দেওয়া
                                liveBtn.innerHTML = `<i class="bi bi-check-circle-fill fs-4 text-white"></i> <span>লোকেশন পাওয়া গেছে!</span>`;
                                liveBtn.classList.replace('btn-primary', 'btn-success'); 
                            })
                            .catch(error => {
                                alert("ঠিকানা খুঁজে পেতে সমস্যা হচ্ছে। দয়া করে নিজে টাইপ করুন।");
                                liveBtn.innerHTML = `<i class="bi bi-geo-alt-fill fs-4 text-white"></i> <span>বর্তমান লোকেশন নিন</span>`;
