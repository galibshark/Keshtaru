    <!-- =========================================

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- মোবাইল মেনু (Offcanvas) ক্লিক করার পর অটোমেটিক বন্ধ করার কোড -->
    <script>
        document.querySelectorAll('.offcanvas-body .dropdown-item').forEach(item => {
            item.addEventListener('click', () => {
                let offcanvasElement = document.getElementById('offcanvasNavbar');
                let bsOffcanvas = bootstrap.Offcanvas.getInstance(offcanvasElement);
                if (bsOffcanvas) {
                    bsOffcanvas.hide();
                }
            });
        });
    </script>
    
    
    
    
    

    <!-- ফর্ম টগল করার স্ক্রিপ্ট -->
    <script>
        function toggleModalAuth(type) {
            if (type === 'register') {
                document.getElementById('modal-login-box').style.display = 'none';
                document.getElementById('modal-register-box').style.display = 'block';
            } else {
                document.getElementById('modal-register-box').style.display = 'none';
                document.getElementById('modal-login-box').style.display = 'block';
            }
        }
    </script>

   
    <script type="module">
        
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { auth } from './firebase-config.js';

        

        let isUserLoggedIn = false;
        const profileBtn = document.getElementById('profile-btn');

        
        // ইউজার লগইন করা আছে কিনা চেক করা  // ইউজার লগইন করা আছে কিনা চেক করা // ইউজার লগইন করা আছে কিনা চেক করা
        // ইউজার লগইন করা আছে কিনা চেক করা  // ইউজার লগইন করা আছে কিনা চেক করা // ইউজার লগইন করা আছে কিনা চেক করা


// ন্যাভবার লোড হওয়ার সিগন্যাল পেলেই প্রোফাইল বাটন কাজ করবে
        document.addEventListener('NavbarLoaded', function() {
            const profileBtn = document.getElementById('profile-btn');
            
            onAuthStateChanged(auth, (user) => {
                isUserLoggedIn = !!user; 
                if (user) {
                    if(profileBtn) profileBtn.classList.add('text-success', 'fw-bold');
                } else {
                    if(profileBtn) profileBtn.classList.remove('text-success', 'fw-bold');
                }
            });

            if(profileBtn) {
                profileBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (isUserLoggedIn) { window.location.href = "dashboard.html"; } 
                    else { var authModal = new bootstrap.Modal(document.getElementById('authModal')); authModal.show(); }
                });
            }
        });

         // ইউজার লগইন করা আছে কিনা চেক করা  // ইউজার লগইন করা আছে কিনা চেক করা // ইউজার লগইন করা আছে কিনা চেক করা
        // ইউজার লগইন করা আছে কিনা চেক করা  // ইউজার লগইন করা আছে কিনা চেক করা // ইউজার লগইন করা আছে কিনা চেক করা





        // ন্যাভবার লোড হওয়ার পর ফর্ম সাবমিট কাজ করবে
        document.addEventListener('NavbarLoaded', function() {
            
            document.getElementById('modal-login-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const btn = document.getElementById('modal-login-btn');
                btn.innerHTML = "লগইন হচ্ছে... ⏳";
                const email = document.getElementById('modal-login-email').value;
                const password = document.getElementById('modal-login-password').value;

                signInWithEmailAndPassword(auth, email, password)
                    .then(() => { location.reload(); }) 
                    .catch(() => { alert("ইমেইল অথবা পাসওয়ার্ড ভুল হয়েছে!"); btn.innerHTML = "লগইন"; });
            });

            document.getElementById('modal-register-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const btn = document.getElementById('modal-reg-btn');
                btn.innerHTML = "অ্যাকাউন্ট তৈরি হচ্ছে... ⏳";
                const name = document.getElementById('modal-reg-name').value;
                const email = document.getElementById('modal-reg-email').value;
                const password = document.getElementById('modal-reg-password').value;

                createUserWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        updateProfile(userCredential.user, { displayName: name }).then(() => { location.reload(); });
                    })
                    .catch((error) => { alert("সমস্যা হয়েছে: " + error.message); btn.innerHTML = "অ্যাকাউন্ট খুলুন"; });
            });

        });
    </script>
    
    
    <!-- হোম পেজে ডায়নামিক প্রোডাক্ট লোড করার ম্যাজিক -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const combContainer = document.getElementById('comb-container');
            const oilContainer = document.getElementById('oil-container');
            const packContainer = document.getElementById('pack-container');
            const scrunchieContainer = document.getElementById('scrunchie-container');
            const pillowcoverContainer = document.getElementById('pillowcover-container');
            const bonnetContainer = document.getElementById('bonnet-container');

            // productsDB এর সব প্রোডাক্ট একটা একটা করে চেক করা হবে
            for (let key in window.productsDB) {
                
                
            const displayProducts = ["900 taka", "combo-1", "combo-2", "combo-3", "combo-4", "combo-5"];
             if (displayProducts.includes(key)) continue;



                let p = window.productsDB[key];
                
                let cardHTML = `
                <div class="col-6 col-md-4 col-lg-3">
                    <div class="card product-card h-100 shadow-sm border-0 bg-light">
                        <img src="${p.image}" class="card-img-top product-img" alt="${p.name}">
                        <div class="card-body text-center p-3">
                            <h6 class="card-title fw-bold" style="font-size: 0.9rem;">${p.name}</h6>
                            <p class="text-success fw-bold mb-2">${p.price}</p>
                            <a href="product-details.html?id=${key}" class="btn btn-outline-success btn-sm px-3">বিস্তারিত দেখুন</a>
                        </div>
                    </div>
                </div>`;

                // আইডি (key) এর নামের ওপর ভিত্তি করে নির্দিষ্ট বক্সে প্রোডাক্ট পাঠানো
                if (key.includes('comb')) {
                    if(combContainer) combContainer.innerHTML += cardHTML;
                } else if (key.includes('oil')) {
                    if(oilContainer) oilContainer.innerHTML += cardHTML;
                } 
                else if (key.includes('pack')) {
                    if(packContainer) packContainer.innerHTML += cardHTML;
                }
                else if (key.includes('scrunchie')) {
                    if(scrunchieContainer) scrunchieContainer.innerHTML += cardHTML;
                }
                else if (key.includes('pillowcover')) {
                    if(pillowcoverContainer) pillowcoverContainer.innerHTML += cardHTML;
                }
                else if (key.includes('bonnet')) {
                    if(bonnetContainer) bonnetContainer.innerHTML += cardHTML;
                }
                   
                   
            
            }
        });
    </script>
    <script src="cart.js"></script>
    <script src="components.js"></script>
    <script src="products.js"></script>
    <script type="module" src="loginpop.js"></script>
</body>
