<!-- Auth Modal (লগইন ও রেজিস্ট্রেশন পপ-আপ) -->
<div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 12px;">
            <div class="modal-body p-4 p-md-5">
                <button type="button" class="btn-close position-absolute top-0 end-0 m-3 shadow-none" data-bs-dismiss="modal"></button>
                
                <!-- লগইন বক্স -->
                <div id="modal-login-box">
                    <h3 class="text-center fw-bold mb-4" style="color: #2c4c3b;">লগইন করুন</h3>
                    <form id="modal-login-form">
                        <div class="mb-3"><label class="form-label fw-bold" style="color: #2c4c3b;">ইমেইল অ্যাড্রেস</label><input type="email" id="modal-login-email" class="form-control form-control-lg" placeholder="example@email.com" required></div>
                        <div class="mb-4"><label class="form-label fw-bold" style="color: #2c4c3b;">পাসওয়ার্ড</label><input type="password" id="modal-login-password" class="form-control form-control-lg" placeholder="পাসওয়ার্ড দিন" required></div>
                        <button type="submit" id="modal-login-btn" class="btn w-100 py-2 fs-5 text-white fw-bold shadow-sm" style="background-color: #2c4c3b;">লগইন</button>
                    </form>
                    <p class="text-center mt-4 fw-medium text-muted">অ্যাকাউন্ট নেই? <span class="text-success fw-bold" style="cursor: pointer; text-decoration: underline;" onclick="toggleModalAuth('register')">নতুন অ্যাকাউন্ট খুলুন</span></p>
                </div>

                <!-- রেজিস্টার বক্স -->
                <div id="modal-register-box" style="display: none;">
                    <h3 class="text-center fw-bold mb-4" style="color: #2c4c3b;">অ্যাকাউন্ট তৈরি করুন</h3>
                    <form id="modal-register-form">
                        <div class="mb-3"><label class="form-label fw-bold" style="color: #2c4c3b;">আপনার নাম</label><input type="text" id="modal-reg-name" class="form-control form-control-lg" placeholder="আপনার নাম লিখুন" required></div>
                        <div class="mb-3"><label class="form-label fw-bold" style="color: #2c4c3b;">ইমেইল অ্যাড্রেস</label><input type="email" id="modal-reg-email" class="form-control form-control-lg" placeholder="example@email.com" required></div>
                        <div class="mb-4"><label class="form-label fw-bold" style="color: #2c4c3b;">নতুন পাসওয়ার্ড</label><input type="password" id="modal-reg-password" class="form-control form-control-lg" placeholder="পাসওয়ার্ড তৈরি করুন" required></div>
                        <button type="submit" id="modal-reg-btn" class="btn btn-success w-100 py-2 fs-5 fw-bold shadow-sm">অ্যাকাউন্ট খুলুন</button>
                    </form>
                    <p class="text-center mt-4 fw-medium text-muted">ইতিমধ্যেই অ্যাকাউন্ট আছে? <span class="text-success fw-bold" style="cursor: pointer; text-decoration: underline;" onclick="toggleModalAuth('login')">লগইন করুন</span></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleModalAuth(type) {
        if (type === 'register') {
            document.getElementById('modal-login-box').style.display = 'none';
            document.getElementById('modal-register-box').style.display = 'block';
        } else {
            document.getElementById('modal-register-box').style.display = 'none';
            document.getElementById('modal-login-box').style.display = 'block';
        }
    }
</script>
