<!-- Auth Modal (আসল লগইন ও রেজিস্ট্রেশন পপ-আপ) -->
<div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 12px;">
            <div class="modal-body p-4 p-md-5">
                <button type="button" class="btn-close position-absolute top-0 end-0 m-3 shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                
                <!-- লগইন বক্স -->
                <div id="modal-login-box">
                    <h3 class="text-center fw-bold mb-4" style="color: #2c4c3b;">লগইন করুন</h3>
                    <form id="modal-login-form" onsubmit="return false;">
                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: #2c4c3b;">ইমেইল অ্যাড্রেস</label>
                            <input type="email" id="modal-login-email" class="form-control form-control-lg" placeholder="example@email.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold" style="color: #2c4c3b;">পাসওয়ার্ড</label>
                            <input type="password" id="modal-login-password" class="form-control form-control-lg" placeholder="পাসওয়ার্ড দিন" required>
                        </div>
                        <button type="submit" id="modal-login-btn" class="btn w-100 py-2 fs-5 text-white fw-bold shadow-sm" style="background-color: #2c4c3b;">লগইন</button>
                    </form>
                    <p class="text-center mt-4 fw-medium text-muted">অ্যাকাউন্ট নেই? <span class="text-success fw-bold" style="cursor: pointer; text-decoration: underline;" onclick="toggleModalAuth('register')">নতুন অ্যাকাউন্ট খুলুন</span></p>
                </div>

                <!-- রেজিস্টার বক্স -->
                <div id="modal-register-box" style="display: none;">
                    <h3 class="text-center fw-bold mb-4" style="color: #2c4c3b;">অ্যাকাউন্ট তৈরি করুন</h3>
                    <form id="modal-register-form" onsubmit="return false;">
                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: #2c4c3b;">আপনার নাম</label>
                            <input type="text" id="modal-reg-name" class="form-control form-control-lg" placeholder="আপনার নাম লিখুন" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold" style="color: #2c4c3b;">ইমেইল অ্যাড্রেস</label>
                            <input type="email" id="modal-reg-email" class="form-control form-control-lg" placeholder="example@email.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold" style="color: #2c4c3b;">নতুন পাসওয়ার্ড (অন্তত ৬ অক্ষরের)</label>
                            <input type="password" id="modal-reg-password" class="form-control form-control-lg" placeholder="পাসওয়ার্ড তৈরি করুন" required>
                        </div>
                        <button type="submit" id="modal-reg-btn" class="btn btn-success w-100 py-2 fs-5 fw-bold shadow-sm">অ্যাকাউন্ট খুলুন</button>
                    </form>
                    <p class="text-center mt-4 fw-medium text-muted">ইতিমধ্যেই অ্যাকাউন্ট আছে? <span class="text-success fw-bold" style="cursor: pointer; text-decoration: underline;" onclick="toggleModalAuth('login')">লগইন করুন</span></p>
                </div>
            </div>
        </div>

</div>

<!-- ফর্ম টগল করার স্ক্রিপ্ট -->
<script>
    function toggleModalAuth(type) {
        if (type === 'register') {
            document.getElementById('modal-login-box').style.display = 'none';
            document.getElementById('modal-register-box').style.display = 'block';
        } else {
            document.getElementById('modal-register-box').style.display = 'none';
            document.getElementById('modal-login-box').style.display = 'block';
        }
    }
</script>



    <!-- সম্পূর্ণ ডাটাবেস এবং ফাংশনালিটি -->
    <script type="module">

        //log in check  //log in check  //log in check  //log in check  //log in check

        import { onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { auth } from './firebase-config.js';
        let isUserLoggedIn = false;
        
        
        




        // ন্যাভবার লোড হওয়ার সিগন্যাল পেলেই প্রোফাইল বাটন কাজ করবে
        document.addEventListener('NavbarLoaded', function() {
            const profileBtn = document.getElementById('profile-btn');
            
            onAuthStateChanged(auth, (user) => {
                isUserLoggedIn = !!user; 
                if (user) {
                    if(profileBtn) profileBtn.classList.add('text-success', 'fw-bold');
                } else {
                    if(profileBtn) profileBtn.classList.remove('text-success', 'fw-bold');
                }
            });

            if(profileBtn) {
                profileBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (isUserLoggedIn) { window.location.href = "dashboard.html"; } 
                    else { var authModal = new bootstrap.Modal(document.getElementById('authModal')); authModal.show(); }
                });
            }
        });
        

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        if (productId && productsDB[productId]) {
            const product = productsDB[productId];

            // মেইন প্রোডাক্ট লোড করা
            document.title = product.name + " - Keshtaru";
            document.getElementById('main-image').src = product.image;
            document.getElementById('main-title').textContent = product.name;
            
            // হারিয়ে যাওয়া অরিজিনাল প্রাইসটি আবার বসানো হলো
            document.getElementById('main-price').textContent = product.price;
            document.getElementById('main-desc').textContent = product.description;

            // =====================================
            // quantity ক্যালকুলেটর (নতুন লজিক)
            // =====================================
            function getNumericPrice(priceStr) {
                let engStr = priceStr.replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
                return parseInt(engStr.replace(/\D/g, '')) || 0;
            }
            function convertToBanglaNumber(num) {
                return num.toString().replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
            }

            const qtyInput = document.getElementById('quantity');
            const dynamicTotalBox = document.getElementById('dynamic-total-price');
            const basePrice = getNumericPrice(product.price); 
            
            if(qtyInput && dynamicTotalBox) {
                qtyInput.addEventListener('input', function() {
                    let currentQty = parseInt(qtyInput.value) || 1;
                    if (currentQty < 1) { currentQty = 1; qtyInput.value = 1; }
                    
                    // ম্যাজিক: পরিমাণ ১ এর বেশি হলেই শুধু বক্সটা আসবে!
                    if (currentQty > 1) {
                        let newPrice = basePrice * currentQty;
                        dynamicTotalBox.textContent = `মোট: ৳ ${convertToBanglaNumber(newPrice)}`;
                        dynamicTotalBox.style.display = "inline-block"; // বক্স দেখাবে
                    } else {
                        dynamicTotalBox.style.display = "none"; // ১ থাকলে বক্স লুকিয়ে যাবে
                    }
                });
            }








            
            // ★ Add to Cart বাটনে ক্লিক করার লজিক ★
            document.getElementById('add-to-cart-btn').addEventListener('click', function(e) {
                e.preventDefault();
                let currentQty = parseInt(qtyInput.value) || 1;
                
                // কার্টে প্রোডাক্ট আগে থেকেই আছে কিনা চেক করা
                let existingItemIndex = shoppingCart.findIndex(item => item.id === productId);
                if (existingItemIndex > -1) {
                    shoppingCart[existingItemIndex].qty += currentQty;
                } else {
                    shoppingCart.push({
                        id: productId,
                        name: product.name,
                        price: basePrice,
                        image: product.image,
                        qty: currentQty
                    });
                }
                saveCart(); // ডেটা সেভ হলো এবং লাল ব্যাজের সংখ্যা বেড়ে গেলো
                
                // পপ-আপ ওপেন করার কোডটি মুছে দিয়েছি! 
                // তার বদলে বাটনটিতেই ছোট্ট একটি সুন্দর ম্যাজিক দিয়ে দিলাম:
                let btn = document.getElementById('add-to-cart-btn');
                let originalText = btn.innerHTML;
                
                // বাটনটি ২ সেকেন্ডের জন্য সবুজ হয়ে কনফার্মেশন দেবে
                btn.innerHTML = '<i class="bi bi-check2-circle fs-5"></i> যোগ হয়েছে!';
                btn.classList.replace('btn-outline-success', 'btn-success');
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.replace('btn-success', 'btn-outline-success');
                }, 2000);
            });
            
            
            
            
            
            
            document.getElementById('main-desc').textContent = product.description;
            // [Order Now] বাটনে ক্লিক করলে চেকআউট পেজে নিয়ে যাবে
            document.getElementById('order-btn').addEventListener('click', function (e) {
                e.preventDefault();
                
                if (!isUserLoggedIn) {
                    var authModal = new bootstrap.Modal(document.getElementById('authModal'));
                    authModal.show();
                    return; 
                }

                let qty = document.getElementById('quantity').value;
                window.location.href = `checkout.html?id=${productId}&qty=${qty}`;
            });

               
            
            //===========////=====================//====================//







            // রিভিউ সেকশন ও গ্যালারি ডায়নামিক করা
            const reviewSection = document.getElementById('review-section');
            const reviewCountText = document.getElementById('review-count-text');
            const reviewThumbnails = document.getElementById('review-thumbnails');
            const carouselInner = document.getElementById('carousel-inner-content');

            if (product.reviews && product.reviews.length > 0) {
                reviewSection.style.display = "block";
                reviewCountText.textContent = `Customer Review (${product.reviews.length}টি)`;
                reviewThumbnails.innerHTML = "";
                carouselInner.innerHTML = "";

                product.reviews.forEach((imgSrc, index) => {
                    // ছোট থাম্বনেইল
                    reviewThumbnails.innerHTML += `
                        <img src="${imgSrc}" class="review-thumb shadow-sm" alt="Review" 
                             data-bs-toggle="modal" data-bs-target="#reviewLightbox" 
                             onclick="goToSlide(${index})">
                    `;

                    // ফুলস্ক্রিন গ্যালারির ছবি
                    let activeClass = index === 0 ? "active" : "";
                    carouselInner.innerHTML += `
                        <div class="carousel-item ${activeClass}">
                            <img src="${imgSrc}" class="d-block w-100 lightbox-img" alt="Review">
                        </div>
                    `;
                });
            } else {
                reviewSection.style.display = "none";
            }

            // ডায়নামিক 'You can also buy' সেকশন তৈরি করা
            const suggestionContainer = document.getElementById('suggestion-container');
            let allKeys = Object.keys(productsDB);

            // যে প্রোডাক্টটি দেখছি সেটি বাদে বাকিগুলো ফিল্টার করা
            allKeys = allKeys.filter(key => key !== productId);

            // সবগুলো প্রোডাক্ট দেখাবো, তাই লিমিট সরিয়ে দিলাম
            allKeys.sort(() => 0.5 - Math.random());
            let selectedKeys = allKeys; 

            selectedKeys.forEach(key => {
                let p = productsDB[key];
                
                // ডানে-বামে স্ক্রল বাদ দিয়ে হোম পেজের মতো গ্রিড (কলাম) করা হলো
                let cardHTML = `
                <div class="col-6 col-md-4 col-lg-3">
                    <div class="card product-card h-100 shadow-sm border-0 bg-white">
                        <img src="${p.image}" class="card-img-top related-product-img" alt="${p.name}">
                        <div class="card-body text-center p-3">
                            <h6 class="card-title fw-bold" style="font-size: 0.9rem;">${p.name}</h6>
                            <p class="text-success fw-bold mb-2">${p.price}</p>
                            <a href="product-details.html?id=${key}" class="btn btn-outline-success btn-sm w-100">বিস্তারিত দেখুন</a>
                        </div>
                    </div>
                </div>`;
                suggestionContainer.innerHTML += cardHTML;
            });

        } else {
            // ভুল লিংকের জন্য
            document.getElementById('main-title').textContent = "প্রোডাক্ট পাওয়া যায়নি!";
            document.getElementById('main-desc').textContent = "আপনি যে প্রোডাক্টটি খুঁজছেন তা হয়তো রিমুভ করা হয়েছে অথবা লিংকটি ভুল। দয়া করে হোম পেজে ফিরে যান।";
            document.getElementById('order-btn').style.display = "none";
        }



        // ==========================================
        // পপ-আপ থেকে লগইন ও রেজিস্ট্রেশন করার লজিক
        // ==========================================

        // ন্যাভবার লোড হওয়ার পর ফর্ম সাবমিট কাজ করবে
        document.addEventListener('NavbarLoaded', function() {
            
            document.getElementById('modal-login-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const btn = document.getElementById('modal-login-btn');
                btn.innerHTML = "লগইন হচ্ছে... ⏳";
                const email = document.getElementById('modal-login-email').value;
                const password = document.getElementById('modal-login-password').value;

                signInWithEmailAndPassword(auth, email, password)
                    .then(() => { location.reload(); }) 
                    .catch(() => { alert("ইমেইল অথবা পাসওয়ার্ড ভুল হয়েছে!"); btn.innerHTML = "লগইন"; });
            });

            document.getElementById('modal-register-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const btn = document.getElementById('modal-reg-btn');
                btn.innerHTML = "অ্যাকাউন্ট তৈরি হচ্ছে... ⏳";
                const name = document.getElementById('modal-reg-name').value;
                const email = document.getElementById('modal-reg-email').value;
                const password = document.getElementById('modal-reg-password').value;

                createUserWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        updateProfile(userCredential.user, { displayName: name }).then(() => { location.reload(); });
                    })
                    .catch((error) => { alert("সমস্যা হয়েছে: " + error.message); btn.innerHTML = "অ্যাকাউন্ট খুলুন"; });
            });

        });


        ///===========================//=========================================//




        
        // লাইটবক্সে ক্লিক করা ছবিতে যাওয়ার ফাংশন
        function goToSlide(index) {
            const carouselElement = document.getElementById('reviewCarousel');
            const carousel = bootstrap.Carousel.getOrCreateInstance(carouselElement);
            carousel.to(index);
        }

        </script>
        <script src="cart.js"></script>
        <script src="components.js"></script>
        <script src="products.js"></script>
 </body>
